# CI for the Relay learning edition. This activates when this folder is pushed
# as its own GitHub repository. It runs the same three commands the README
# documents for a local verification pass. The durability suite runs real
# child-process crash/lease scenarios, so the job gets a generous timeout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Fresh machines need a browser; the local laptop already had one.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
